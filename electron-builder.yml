appId: com.electron.app
productName: LiftInk
directories:
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
asarUnpack:
  - resources/**
win:
  executableName: LiftInk
nsis:
  include: build/open-pdf.nsh
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target: dmg
  category: public.app-category.productivity
  minimumSystemVersion: "13.0"
  identity: "-"
  entitlementsInherit: build/entitlements.mac.plist
  fileAssociations:
    - ext: pdf
      name: PDF Document
      role: Viewer
  extendInfo:
    NSDocumentsFolderUsageDescription: LiftInk 需要访问你选择导入或保存的文稿。
    NSDownloadsFolderUsageDescription: LiftInk 需要访问你选择导入或保存的下载文件。
  notarize: false
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish: null
